name: Tests

on: [push, pull_request]

jobs:
  phpstan:
    name: PHPStan
    strategy:
      matrix:
        # PHP 8.2 resolves to Symfony 7.4 (Symfony 8 requires PHP 8.4+); PHP 8.4 resolves to Symfony 8.
        php-version: ["8.2", "8.4"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
        env:
          fail-fast: true

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # Analysis runs against doctrine/dbal 4 (Symfony 8 on PHP 8.4, Symfony 7.4 on PHP 8.2).
      # The doctrine/dbal 3 only DBAL3\Connection decorator is excluded in
      # phpstan.neon (its bool transaction methods are not covariant with the
      # dbal 4 parent); it is exercised on dbal 3 by the PHPUnit job below.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --no-scripts --ansi

      - name: Run static code analysis
        run: vendor/bin/phpstan analyze src/ --memory-limit="-1" --ansi --no-progress

  php-cs-fixer:
    name: PHP-CS-Fixer
    strategy:
      matrix:
        php-version: ["8.4"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
        env:
          fail-fast: true

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --ansi

      - name: Check coding standards
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --ansi

  phpunit:
    name: PHPUnit
    strategy:
      matrix:
        php-version: ["8.2", "8.4"]
        dbal: ["^3.6", "^4.0"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug
          extensions: grpc,amqp,redis
        env:
          fail-fast: true

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # The PHP version selects the Symfony major: Symfony 8 requires PHP 8.4+,
      # so PHP 8.2 resolves to Symfony 7.4 while PHP 8.4 resolves to Symfony 8.
      # The doctrine/dbal major is pinned so both the DBAL 3 and DBAL 4 connection
      # decorators are exercised on each Symfony major.
      - name: Pin doctrine/dbal version
        run: composer require --dev --no-update "doctrine/dbal:${{ matrix.dbal }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --no-scripts --ansi

      - name: Install extra dependencies
        run: composer require --dev symfony/redis-messenger symfony/amqp-messenger

      - name: Run unit tests
        run: vendor/bin/phpunit --colors=always --coverage-text
